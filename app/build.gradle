plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projectfinal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.projectfinal'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
